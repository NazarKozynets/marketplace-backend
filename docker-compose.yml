services:
  postgres:
    image: postgres:16
    container_name: local-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: my_app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
